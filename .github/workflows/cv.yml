name: Build CV

on:
  push:
    paths:
      - cv.tex
      - .github/workflows/cv.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: WtfJoke/setup-tectonic@5e1ba6e10229bd876c6594189bdab1a62b9d0b1c # v4.0.6
        with:
          tectonic-version: 0.17.0
      - name: Compile PDF
        run: |
          mkdir -p build
          tectonic --keep-logs --outdir build cv.tex
      - name: Save PDF and compilation log
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: weichen-zhang-cv
          path: |
            build/cv.pdf
            build/cv.log
          if-no-files-found: error
          retention-days: 30
